[package]
name = "my-no-sql-core"
version = "0.5.1"
edition = "2021"

[features]
default = []
# master-node keeps rows in memory and may compress them per-table, so it pulls in flate2
master-node = ["dep:flate2"]
debug_db_row = []


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
my-no-sql-abstractions = { path = "../my-no-sql-abstractions" }
my-json = { tag = "0.3.2", git = "https://github.com/MyJetTools/my-json.git" }
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }
tokio = { version = "*", features = ["full"] }
serde_json = { version = "*" }
serde = { version = "*", features = ["derive"] }
# Per-table in-memory row compression (master-node only). Client readers do not pull this in.
# Pure-Rust zlib-rs backend: no C toolchain needed to build.
flate2 = { version = "*", optional = true, default-features = false, features = [
    "zlib-rs",
] }
