[package]
name = "my-no-sql-tcp-shared"
version = "0.5.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
my-tcp-sockets = { tag = "0.1.12", git = "https://github.com/my-jet-tools/my-tcp-sockets" }
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }

tokio = { version = "*", features = ["full"] }
tokio-util = "*"
parking_lot = "*"
async-trait = "*"
# Compression of the server -> node link (see `compression` and `batch`): the packing of the
# my-reverse-proxy gateway. LZ4 and Zstandard are C libraries, so they are optional: the SDK
# turns them on for `master-node` / `read-node` only.
lz4 = { version = "1", optional = true }
zstd = { version = "0.14", default-features = false, optional = true }

[features]
compression = ["dep:lz4", "dep:zstd"]
