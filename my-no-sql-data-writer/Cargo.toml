[package]
name = "my-no-sql-data-writer"
version = "0.5.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[features]
default = []
with-ssh = ["flurl/with-ssh"]

# TLS for `https://` MyNoSql urls. FlUrl compiles its TLS paths only when one of these
# is on; without either, an https url panics at request time. Pick exactly one —
# enabling both is not an error (my-tls resolves it in favour of ring), which is what
# `--all-features` does.
#
# Pure Rust (rustls-graviola): no C toolchain anywhere, but x86_64/aarch64 only.
with-rust-tls = ["flurl/with-rust-tls"]
# ring: mature and widely deployed, at the cost of a bundled C/assembly build.
with-ring-tls = ["flurl/with-ring-tls"]

[dependencies]
my-no-sql-abstractions = { path = "../my-no-sql-abstractions" }
my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
] }
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url" }

my-json = { tag = "0.3.2", git = "https://github.com/MyJetTools/my-json.git" }

tokio = { version = "*", features = ["full"] }
tokio-util = "*"
async-trait = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_derive = "*"
lazy_static = "*"
parking_lot = "*"

[dev-dependencies]
my-no-sql-core = { path = "../my-no-sql-core" }
