[package]
name = "my-no-sql-sdk"
version = "0.5.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
data-writer = ["dep:my-no-sql-data-writer"]
macros = ["dep:my-no-sql-macros", "dep:rust-extensions"]
data-reader = ["dep:my-no-sql-tcp-reader"]
tcp-contracts = ["dep:my-no-sql-tcp-shared"]
# The server packs what it sends to a node with LZ4 or Zstandard, the level the node asks for
# (see `my_no_sql_tcp_shared::CompressionLevel`). Both are C libraries, so only the
# infrastructure roles - the server and the node - get the codecs; a service built with
# `data-reader` / `data-writer` builds without a C toolchain. `?` - the codecs are turned on
# only when `tcp-contracts` brings the crate in.
master-node = [
    "my-no-sql-core/master-node",
    "my-no-sql-server-core/master-node",
    "my-no-sql-tcp-shared?/compression",
]

read-node = ["my-no-sql-server-core", "my-no-sql-tcp-shared?/compression"]

debug_db_row = ["my-no-sql-core/debug_db_row"]
with-ssh = ["my-no-sql-data-writer?/with-ssh"]

# TLS for `https://` MyNoSql urls — see my-no-sql-data-writer. Only meaningful together
# with `data-writer`; pick one. Without either, a request to an https url fails with `UnsupportedScheme`.
with-rust-tls = ["my-no-sql-data-writer?/with-rust-tls"]
with-ring-tls = ["my-no-sql-data-writer?/with-ring-tls"]


[dependencies]

my-no-sql-abstractions = { path = "../my-no-sql-abstractions" }
my-no-sql-core = { path = "../my-no-sql-core" }
my-no-sql-server-core = { path = "../my-no-sql-server-core", optional = true }

my-no-sql-data-writer = { optional = true, path = "../my-no-sql-data-writer" }
my-no-sql-macros = { optional = true, path = "../my-no-sql-macros" }
my-no-sql-tcp-reader = { optional = true, path = "../my-no-sql-tcp-reader" }
my-no-sql-tcp-shared = { optional = true, path = "../my-no-sql-tcp-shared" }

rust-extensions = { optional = true, tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }
# Enabled by the `macros` feature and re-exported as `my_no_sql_sdk::rust_extensions`.
